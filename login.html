<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in · Marketing OS</title>
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-card { width: 100%; max-width: 380px; padding: var(--space-8) var(--space-6); }
  .login-brand { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: var(--space-6); }
  .login-brand .mark { width: 34px; height: 34px; border-radius: 9px; background: var(--color-primary); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .login-brand .name { font-weight: 700; font-size: 15px; letter-spacing: 0.01em; }
  .login-tagline { text-align: center; color: var(--color-muted); font-size: 12.5px; margin-bottom: var(--space-8); margin-top: -12px; }
  .row-between { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-5); }
  .remember { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--color-muted); }
  .forgot { font-size: 12.5px; font-weight: 600; color: var(--color-primary); }
  .demo-note { font-size: 11.5px; color: var(--color-faint); text-align: center; margin-top: var(--space-5); line-height: 1.5; }
</style>
</head>
<body>
  <div class="card login-card">
    <div class="login-brand"><div class="mark">M</div><div class="name">MARKETING OS</div></div>
    <p class="login-tagline">One workspace for everything marketing.</p>

    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input class="input" type="email" id="email" placeholder="you@agency.example.com" value="nikhil@agency.example.com" required />
        <span class="error-text">Enter a valid email address.</span>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input class="input" type="password" id="password" placeholder="••••••••" value="demo-password" required />
      </div>
      <div class="row-between">
        <label class="remember"><input type="checkbox" checked /> Remember me</label>
        <a class="forgot" href="#" id="forgot-link">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">Log in</button>
    </form>
    <p class="demo-note">Demo build — any email/password logs you in as the agency admin. Data lives in this browser only (localStorage), seeded with demo clients.</p>
  </div>

  <script type="module">
    import { login } from "./js/auth.js";
    import { toast, getParam } from "./js/utils.js";

    const form = document.getElementById("login-form");
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const btn = document.getElementById("login-btn");
      btn.disabled = true;
      btn.textContent = "Logging in…";
      setTimeout(() => {
        login(email);
        const next = getParam("next") || "pages/dashboard.html";
        window.location.href = next;
      }, 400);
    });

    document.getElementById("forgot-link").addEventListener("click", (e) => {
      e.preventDefault();
      toast("Password reset isn't wired up in this demo build.", "danger");
    });
  </script>
</body>
</html>
